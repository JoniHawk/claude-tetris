<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <button id="theme-toggle" type="button" tabindex="-1" aria-pressed="false">Modo claro</button>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <p id="new-record-msg" class="hidden"></p>
          <form id="name-form" class="hidden" autocomplete="off">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
            <button id="save-record-btn" type="submit">Guardar</button>
          </form>
          <div id="records" class="records">
            <span class="label">RECORDS</span>
            <ol id="records-list"></ol>
            <p id="records-stats"></p>
            <button id="reset-records-btn" type="button">Resetear records</button>
          </div>
          <button id="restart-btn">Jugar</button>

          <div id="pause-menu" class="hidden">
            <button id="resume-btn" type="button">Reanudar</button>
            <button id="pause-restart-btn" type="button">Reiniciar</button>
            <button id="controls-btn" type="button">Ver controles</button>
            <div class="level-select">
              <span>Nivel inicial</span>
              <button id="level-down" type="button" aria-label="Bajar nivel inicial">&minus;</button>
              <span id="start-level">1</span>
              <button id="level-up" type="button" aria-label="Subir nivel inicial">+</button>
            </div>
            <p class="menu-hint">Se aplica al reiniciar</p>
          </div>

          <div id="controls-view" class="hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button id="controls-back-btn" type="button">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
